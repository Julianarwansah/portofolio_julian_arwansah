  <body id="home">
    <!-- The theme must land before first paint. Every selector in index.css is
         body.light-mode while the CSS default is dark, so applying the class
         from a React effect flashed the page dark for one frame on every load. -->
    <script>
      try {
        // Must mirror readInitialTheme in ThemeProvider.jsx, or the pre-paint
        // class and the first React render disagree and the page flashes.
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "light") {
          document.body.classList.add("light-mode");
        }
      } catch (e) {
        /* Storage is blocked in private browsing; the React toggle still works. */
      }
    </script>

  </body>
